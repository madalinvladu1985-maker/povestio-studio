name: Povestio - lista voci

on:
  push:
    branches: [main]
    paths:
      - "verificari/cerere_voci.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/voci_elevenlabs.py
      - run: |
          git config user.name "Povestio Bot"
          git config user.email "povestio-bot@users.noreply.github.com"
          git add verificari/voci.json
          git diff --cached --quiet || git commit -m "Povestio: lista voci"
          git pull --rebase --autostash
          git push
