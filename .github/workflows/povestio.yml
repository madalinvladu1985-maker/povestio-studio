name: Povestio - randare clipuri

on:
  push:
    branches: [main]
    paths:
      - "clipuri/**.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: povestio-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalare
        run: pip install -r requirements.txt

      - name: Cache voci și imagini
        uses: actions/cache@v4
        with:
          path: cache
          key: povestio-cache-${{ github.run_id }}
          restore-keys: povestio-cache-

      - name: Randare clipuri noi
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
        run: python studio.py batch

      - name: Urcare în GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python studio.py release

      - name: Salvare manifeste
        run: |
          git config user.name "Povestio Bot"
          git config user.email "povestio-bot@users.noreply.github.com"
          git add publicat/
          git diff --cached --quiet || git commit -m "Povestio: clipuri randate $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
