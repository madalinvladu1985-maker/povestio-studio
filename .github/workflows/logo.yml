name: Povestio - surse logo

on:
  push:
    branches: [main]
    paths:
      - "brands/atentales/logo_cerere.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/logo_surse.py
      - run: |
          git config user.name "Povestio Bot"
          git config user.email "povestio-bot@users.noreply.github.com"
          git add brands/atentales/logo_surse
          git diff --cached --quiet || git commit -m "Povestio: surse logo"
          git pull --rebase --autostash
          git push
