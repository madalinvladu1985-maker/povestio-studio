name: Povestio - verificare voce

on:
  push:
    branches: [main]
    paths:
      - "verificari/cerere_voce.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcriere:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install faster-whisper
      - run: python scripts/transcrie.py
      - run: |
          git config user.name "Povestio Bot"
          git config user.email "povestio-bot@users.noreply.github.com"
          git add verificari/
          git diff --cached --quiet || git commit -m "Povestio: transcriere voce"
          git pull --rebase --autostash
          git push
