name: Povestio - test Gemini

on:
  push:
    branches: [main]
    paths:
      - "verificari/cerere_gemini.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/test_gemini.py
      - run: |
          git config user.name "Povestio Bot"
          git config user.email "povestio-bot@users.noreply.github.com"
          git add verificari/test_gemini
          git diff --cached --quiet || git commit -m "Povestio: test Gemini"
          git pull --rebase --autostash
          git push
